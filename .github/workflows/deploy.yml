name: Deploy

on:
  push:
    branches: [main]
  # Once a day, so the law pages follow new releases of the packs.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# One deploy at a time, and a newer one waits rather than cancelling one half done.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Waitlist settings
        # The Cloud waitlist's Turnstile site key and D1 database id are repository secrets.
        # This stops the deploy if either is missing, and pins the database in wrangler.jsonc.
        run: node scripts/deploy-config.mjs
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - name: Build
        run: npm run build
        env:
          # The law pages read the packs' releases through GitHub's API, whose limit is far
          # higher for the workflow's own token than for an address.
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: Site
        run: npm run check:site

      - name: Deploy
        # wrangler.jsonc names the Worker, the files and the domain.
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
